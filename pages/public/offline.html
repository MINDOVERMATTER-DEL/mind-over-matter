<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#075c47" />
    <title>You’re offline | Mind Over Matter</title>
    <!--
      Shown by the service worker (sw.js) when someone opens the site with no internet connection.
      Everything is inside this one file (styles and the logo too), because nothing else can be downloaded offline.
    -->
    <style>
      * { box-sizing: border-box; }
      body {
        display: grid;
        place-items: center;
        min-height: 100vh;
        min-height: 100svh;
        margin: 0;
        padding: 1.5rem 1rem;
        background:
          repeating-linear-gradient(132deg, transparent 0 34px, rgb(255 255 255 / 6%) 34px 35px),
          linear-gradient(135deg, #17b58a 0%, #0b7a5e 32%, #075c47 58%, #0e8a68 78%, #054634 100%);
        color: #0c2620;
        font-family: "DM Sans Variable", "Segoe UI", system-ui, -apple-system, sans-serif;
        line-height: 1.6;
      }
      .card {
        display: grid;
        justify-items: center;
        width: min(100%, 34rem);
        padding: clamp(2rem, 5vw, 3rem) clamp(1.25rem, 5vw, 2.75rem);
        border: 1px solid rgb(255 255 255 / 40%);
        border-radius: 22px;
        background: #fff;
        box-shadow: 0 30px 60px rgb(3 38 28 / 35%);
        text-align: center;
        animation: rise 0.6s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      .badge { position: relative; margin-bottom: 1.5rem; }
      .badge img { display: block; width: 72px; height: 72px; border-radius: 50%; box-shadow: 0 0 0 6px rgb(13 122 92 / 12%); }
      .badge span {
        position: absolute;
        right: -6px;
        bottom: -4px;
        display: grid;
        place-items: center;
        width: 32px;
        height: 32px;
        border: 3px solid #fff;
        border-radius: 50%;
        background: #f26b1d;
        color: #fff;
      }
      .eyebrow { margin: 0 0 0.8rem; color: #b93d0b; font-size: 0.78rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; }
      h1 {
        margin: 0;
        color: #0a6b55;
        font-family: "Fraunces Variable", Georgia, "Times New Roman", serif;
        font-size: clamp(1.9rem, 5vw, 2.6rem);
        font-weight: 600;
        letter-spacing: -0.04em;
        line-height: 1.05;
      }
      p.text { max-width: 26rem; margin: 1rem 0 0; color: #3a554d; }
      ul { margin: 1.25rem 0 0; padding: 0; list-style: none; color: #3a554d; font-size: 0.92rem; text-align: left; }
      li { position: relative; padding-left: 1.4rem; }
      li + li { margin-top: 0.35rem; }
      li::before { content: ""; position: absolute; top: 0.6em; left: 0.3rem; width: 6px; height: 6px; border-radius: 50%; background: #0b7a5e; }
      button {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        margin-top: 1.75rem;
        padding: 0.85rem 1.4rem;
        border: 0;
        border-radius: 999px;
        background: linear-gradient(135deg, #17b58a 0%, #0b7a5e 45%, #054634 100%);
        color: #fff;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
        box-shadow: 0 10px 22px rgb(6 78 59 / 30%);
      }
      button:focus-visible { outline: 3px solid #f26b1d; outline-offset: 3px; }
      .status { min-height: 1.5em; margin: 1rem 0 0; color: #0b7a5e; font-size: 0.9rem; font-weight: 600; }
      @keyframes rise { from { opacity: 0; transform: translateY(24px) scale(0.97); } }
      @media (prefers-reduced-motion: reduce) { .card { animation: none; } }
    </style>
  </head>

      <p class="eyebrow">No internet connection</p>
      <h1>You’re offline.</h1>
      <p class="text">We can’t reach Mind Over Matter right now. Check your connection, then try again.</p>
      <ul>
        <li>Make sure Wi-Fi or mobile data is turned on.</li>
        <li>Turn airplane mode off.</li>
        <li>Move closer to your router, or try another network.</li>
      </ul>
      <button type="button" id="retry">
        <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M240,56v48a8,8,0,0,1-8,8H184a8,8,0,0,1,0-16H211.4L184.81,71.64l-.25-.24a80,80,0,1,0-1.67,114.78,8,8,0,0,1,11,11.63A95.44,95.44,0,0,1,128,224h-1.32A96,96,0,1,1,195.75,60L224,85.8V56a8,8,0,1,1,16,0Z"/></svg>
        Try again
      </button>
      <p class="status" id="status" role="status" aria-live="polite"></p>
    </main>
    <script>
      // Reload by hand, or automatically as soon as the connection comes back.
      document.getElementById('retry').addEventListener('click', () => window.location.reload());
      window.addEventListener('online', () => {
        document.getElementById('status').textContent = 'You’re back online. Loading…';
        window.setTimeout(() => window.location.reload(), 600);
      });
    </script>
